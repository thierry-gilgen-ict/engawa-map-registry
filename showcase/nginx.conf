server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    location = / {
        try_files /index.html =404;
    }

    location = /privacy {
        return 301 /privacy.html;
    }

    location = /privacy.html {
        try_files /privacy.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
