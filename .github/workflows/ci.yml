name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: engawa_registry
          POSTGRES_PASSWORD: engawa_registry
          POSTGRES_DB: engawa_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engawa_registry -d engawa_registry"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://engawa_registry:engawa_registry@127.0.0.1:5432/engawa_registry
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate
        run: pnpm db:migrate

      - name: Test
        run: pnpm test
